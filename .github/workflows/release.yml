name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: unit tests
        run: go test ./... -count=1
      - name: build artefacts
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/release.sh
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS
          generate_release_notes: true
