name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1
      - name: build three binaries
        run: make build
      - name: userspace e2e
        run: sudo bash test/e2e/e2e-sim.sh

  windows-build:
    # The Windows enforcement backend (ACL lockdown) is not exercised here: that
    # needs an elevated Windows host. This job only proves the tree still
    # cross-compiles and that no Linux-only API leaked into shared code.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build ./...

  bpf-build:
    # Verifies the eBPF program still compiles and the binaries build with the
    # regenerated object. Actual LSM enforcement cannot run on hosted runners
    # (the kernel command line is not controllable); use test/e2e/e2e-ebpf.sh on
    # a VM with bpf in the LSM list.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
      - name: bpftool (static release binary)
        run: |
          curl -fsSL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz
          tar -xzf /tmp/bpftool.tar.gz -C /tmp
          sudo install -m 0755 /tmp/bpftool /usr/local/bin/bpftool
          bpftool version
      - name: generate vmlinux.h from the runner BTF
        run: |
          if sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h; then
            echo "BTF_OK=1" >> "$GITHUB_ENV"
            wc -l bpf/vmlinux.h
          else
            echo "this runner has no kernel BTF; skipping the eBPF compile check"
            echo "BTF_OK=0" >> "$GITHUB_ENV"
          fi
      - name: compile eBPF object
        if: env.BTF_OK == '1'
        run: make bpf
      - name: build with the regenerated object
        run: make build
