# Example secret for the Kubernetes DaemonSet. Fill in real values and apply
# with:  kubectl apply -f secret.yaml
#
# ca.crt is the control plane CA certificate (from
# <data-dir>/keys/ca.crt on the server). bootstrap-token is one of the one-time
# tokens printed by `tg-server init` or `tg-server bootstrap-token`.
apiVersion: v1
kind: Secret
metadata:
  name: tamperguard-agent
  namespace: tamperguard
type: Opaque
stringData:
  server-url: "https://tg.example.com:8443"
  bootstrap-token: "REPLACE_WITH_BOOTSTRAP_TOKEN"
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CA_CERTIFICATE
    -----END CERTIFICATE-----
